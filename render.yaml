# Render Blueprint — Aether IDP backend
# Deploy: dashboard.render.com → New → Blueprint → select this repo.
# Frontend stays on Vercel/Netlify (set VITE_API_URL to the backend URL below).
# Supabase SQL files must already be run (see DEPLOY.md step 1).

services:
  - type: web
    name: idp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
        required: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_BACKEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
