name: Build and Push Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/dakshmulundkar/idp-backend:${{ env.SHORT_SHA }}
            ghcr.io/dakshmulundkar/idp-backend:latest

      - name: Update production kustomization image tag
        run: |
          sed -i "s/newTag: .*/newTag: ${{ env.SHORT_SHA }}/" k8s/overlays/production/kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI Bot"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "ci: update backend image to ${{ env.SHORT_SHA }}"
          git push
