apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dakshmulundkar/Internal-Developer-Platform
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: idp-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
