<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>major</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var t = localStorage.getItem('aether-theme');
        var d = t === 'light' ? 'light' : t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'dark';
        document.documentElement.classList.add(d);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
