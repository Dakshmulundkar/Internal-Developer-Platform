apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.idp.devcorp.com
      secretName: idp-tls
  rules:
    - host: api.idp.devcorp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp-backend
                port:
                  number: 8000
