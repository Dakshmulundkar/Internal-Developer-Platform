apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-backend
  labels:
    app: idp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idp-backend
  template:
    metadata:
      labels:
        app: idp-backend
    spec:
      containers:
        - name: idp-backend
          image: ghcr.io/dakshmulundkar/idp-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: idp-config
            - secretRef:
                name: idp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
