# Netlify — Aether IDP frontend
# Set VITE_API_URL in the Netlify UI (Site settings → Environment variables)
# to the Railway backend public URL, e.g. https://aether-idp.up.railway.app

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — the app is a custom state router, all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
