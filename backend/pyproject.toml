[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-backend"
version = "0.1.0"
description = "Internal Developer Platform — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "supabase==2.5.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pydantic-settings==2.3.3",
    "apscheduler==3.10.4",
    "cryptography==46.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
